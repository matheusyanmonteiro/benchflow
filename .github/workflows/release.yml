name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-release-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar o uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Instalar o Python e as dependências
        run: |
          uv python install 3.12
          uv sync --locked --dev --python 3.12

      - name: Validar tag e versão do projeto
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag inválida: $GITHUB_REF_NAME. Use Semantic Versioning, por exemplo v1.2.3."
            exit 1
          fi

          project_version=$(uv version --short)
          if [[ "v${project_version}" != "$GITHUB_REF_NAME" ]]; then
            echo "A tag $GITHUB_REF_NAME não corresponde à versão v${project_version} do pyproject.toml."
            exit 1
          fi

          echo "version=${project_version}" >> "$GITHUB_OUTPUT"

      - name: Executar lint, testes e cobertura
        run: |
          uv run ruff check .
          uv run pytest

      - name: Construir os pacotes Python
        run: |
          uv build --no-sources
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Atestar a procedência dos pacotes Python
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Validar a imagem localmente
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="benchflow:${VERSION}"
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image" \
            .

          container_id=$(docker run --detach --publish 8000:8000 "$image")
          trap 'docker rm --force "$container_id"' EXIT

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1

      - name: Publicar a imagem no GitHub Container Registry
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          local_image="benchflow:${VERSION}"
          sha_tag="sha-${GITHUB_SHA::12}"

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$local_image" "$image:$VERSION"
          docker tag "$local_image" "$image:$GITHUB_REF_NAME"
          docker tag "$local_image" "$image:$sha_tag"
          push_output=$(docker push "$image:$VERSION")
          printf '%s\n' "$push_output"
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' <<< "$push_output" | tail -n 1)
          if [[ -z "$digest" ]]; then
            echo "Não foi possível obter o digest da imagem publicada."
            exit 1
          fi

          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:$sha_tag"

          if [[ "$VERSION" != *-* ]]; then
            docker tag "$local_image" "$image:latest"
            docker push "$image:latest"
          fi

          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Atestar a procedência da imagem
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publicar a GitHub Release e seus artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          repository_lower="${GITHUB_REPOSITORY,,}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          sed \
            -e "s|{{REPOSITORY}}|$repository_lower|g" \
            -e "s|{{VERSION}}|$VERSION|g" \
            .github/RELEASE_TEMPLATE.md > "$notes_file"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --notes-file "$notes_file" \
              --title "BenchFlow $GITHUB_REF_NAME" \
              --draft
          fi

          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          fi
